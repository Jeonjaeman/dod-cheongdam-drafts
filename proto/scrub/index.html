<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>영상 프레임 스크롤 기술 테스트 — 디오디청담 (아트디렉션 아님)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#08171A; --fg:#F0F6F2; --acc:#A8E4CE; }
  * { box-sizing: border-box }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Pretendard Variable", sans-serif; word-break: keep-all }
  .note { padding: 12px 20px; font-size: 12px; background: #11292c; color: #8FAAA4 }
  /* 스크럽 구간: 높이 = 스크롤 거리. sticky 무대는 svh로 iOS 주소창 변동에 덜 흔들림 */
  .scrub { position: relative; height: 320svh }
  .stage { position: sticky; top: 0; height: 100svh; overflow: hidden }
  .frame { position: absolute; inset: 0; clip-path: inset(var(--it) var(--ix) var(--it) var(--ix)); will-change: clip-path }
  .frame video, .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
  .frame img { transition: opacity .3s }
  .frame.ready img.poster { opacity: 0 }
  .copy { position: absolute; left: 6vw; bottom: 12svh; z-index: 2; max-width: 34rem }
  .copy h1 { margin: 0; font-weight: 500; font-size: clamp(34px, 5vw, 64px); line-height: 1.15; letter-spacing: -.02em }
  .copy p { margin: 1rem 0 0; color: #b9cfc8 }
  .after { min-height: 100svh; padding: 15svh 6vw; background: #0c1f22 }
  /* 진료 문의: 미디어 준비와 무관하게 항상 접근 가능 */
  .cta { position: fixed; z-index: 10; display: flex; gap: 8px }
  .cta a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 15px }
  .cta .tel { background: var(--acc); color: var(--bg) } .cta .kakao { background: #FEE500; color: #191919 }
  @media (min-width: 768px) { .cta { top: 52px; right: 24px } }
  @media (max-width: 767px) { .cta { left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(8,23,26,.9); backdrop-filter: blur(8px) } .cta a { flex: 1 } .after { padding-bottom: 120px } }
  .hud { position: fixed; left: 8px; top: 52px; z-index: 20; font: 11px/1.4 ui-monospace, monospace; background: rgba(0,0,0,.65); color: #9ff; padding: 6px 8px; white-space: pre; pointer-events: none; display: none }
  .debug .hud { display: block }
  @media (prefers-reduced-motion: reduce) { .scrub { height: auto } .stage { position: relative } .frame { clip-path: none } }
</style>
</head>
<body>
<p class="note">기술 테스트 페이지 — 영상 프레임 스크롤(seek) 동작 검증용이며 디자인 확정본이 아닙니다. 영상은 생성 이미지 기반 추상 연출입니다.</p>
<nav class="cta" aria-label="진료 문의">
  <a class="tel" href="tel:02-6203-6263">전화 진료 문의</a>
  <a class="kakao" href="https://pf.kakao.com/_cBamG" rel="noopener">카카오 진료 문의</a>
</nav>
<main>
  <section class="scrub" aria-labelledby="t">
    <div class="stage">
      <div class="frame" id="frame">
        <picture>
          <source media="(max-width: 767px)" srcset="../../assets/video/poster-m.webp">
          <img class="poster" src="../../assets/video/poster-pc.webp" alt="" width="1920" height="1072">
        </picture>
        <video id="v" muted playsinline preload="auto" aria-hidden="true"></video>
      </div>
      <div class="copy">
        <h1 id="t">피부를 살피고,<br>진료를 이야기하다</h1>
        <p>스크롤에 따라 장면이 앞뒤로 움직입니다.</p>
      </div>
    </div>
  </section>
  <section class="after"><h2>다음 구간</h2><p>스크럽 구간이 끝나면 일반 스크롤로 이어집니다.</p></section>
</main>
<div class="hud" id="hud"></div>
<script>
(() => {
  const mobile = matchMedia('(max-width: 767px)').matches;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const debug = /debug/.test(location.search);
  if (debug) document.body.classList.add('debug');
  const v = document.getElementById('v'), frame = document.getElementById('frame'), sec = document.querySelector('.scrub'), hud = document.getElementById('hud');
  const src = mobile ? '../../assets/video/scrub-m.mp4' : '../../assets/video/scrub-pc.mp4';
  // 프레임 열림: PC 가장자리 inset → 0, 모바일 4:5 인셋(폭 약 64%) → 전면
  const ix0 = mobile ? 18 : 14, it0 = mobile ? 14 : 10;
  const setOpen = p => { const k = Math.min(1, p / 0.35); frame.style.setProperty('--ix', (ix0 * (1 - k)).toFixed(3) + '%'); frame.style.setProperty('--it', (it0 * (1 - k)).toFixed(3) + '%'); };

  if (reduce) { // 같은 의미의 정지 장면
    frame.querySelector('img.poster').src = mobile ? '../../assets/video/still-m.webp' : '../../assets/video/still-pc.webp';
    frame.querySelector('source').srcset = '../../assets/video/still-m.webp';
    setOpen(1); return;
  }

  const stats = { seeks: 0, seekMs: [], skipped: 0, blobMB: 0, loadMs: 0 };
  let ready = false, seekStart = 0;
  v.addEventListener('seeking', () => { seekStart = performance.now(); });
  v.addEventListener('seeked', () => { stats.seekMs.push(performance.now() - seekStart); if (stats.seekMs.length > 300) stats.seekMs.shift(); });

  // Apple 방식: 파일 전체를 Blob으로 받아 탐색 지연 제거. 준비 전에는 포스터 유지
  const t0 = performance.now();
  fetch(src).then(r => r.blob()).then(b => {
    stats.blobMB = +(b.size / 1048576).toFixed(2);
    v.src = URL.createObjectURL(b);
    v.addEventListener('loadeddata', () => { ready = true; stats.loadMs = Math.round(performance.now() - t0); frame.classList.add('ready'); }, { once: true });
  }).catch(() => { /* 실패 시 포스터·문구·문의 버튼은 그대로 */ });

  let cur = 0;
  const progress = () => { const r = sec.getBoundingClientRect(); const len = r.height - innerHeight; return Math.min(1, Math.max(0, -r.top / len)); };
  const tick = () => {
    const p = progress();
    setOpen(p);
    if (ready && v.duration) {
      const target = p * (v.duration - 0.05);
      cur += (target - cur) * 0.25;               // 보간
      const settled = Math.abs(target - cur) < 0.004;
      if (settled) cur = target;                    // 멈추면 정확히 같은 시각으로 — 정·역스크롤 동일 프레임
      // rAF당 최대 1회, 진행 중인 seek이 있으면 건너뜀(iOS 큐 적체 방지)
      if (!v.seeking && Math.abs(v.currentTime - cur) > (settled ? 0.0005 : 1 / 48)) { v.currentTime = cur; stats.seeks++; }
      else if (v.seeking) stats.skipped++;
    }
    if (debug) {
      const s = stats.seekMs.slice().sort((a, b) => a - b);
      const mem = performance.memory ? (performance.memory.usedJSHeapSize / 1048576).toFixed(1) + 'MB' : 'n/a';
      hud.textContent = `p=${p.toFixed(3)} t=${v.currentTime.toFixed(3)}/${(v.duration||0).toFixed(2)}\nready=${ready} load=${stats.loadMs}ms blob=${stats.blobMB}MB\nseeks=${stats.seeks} skipped=${stats.skipped}\nseek p50=${(s[s.length>>1]||0).toFixed(1)} p95=${(s[Math.floor(s.length*.95)]||0).toFixed(1)}ms\nheap=${mem} src=${mobile?'mobile':'pc'}`;
    }
    window.__scrub = { p, t: v.currentTime, ready, stats };
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
